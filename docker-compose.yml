services:
  app:
    build: .
    environment:
      - DB_URL=jdbc:postgresql://db/ark_invest_db
      - DB_USER
      - DB_PASS
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    volumes:
      - ./db/create_test_db.sh:/docker-entrypoint-initdb.d/create_test_db.sh
      - ./db/create_tables.sql:/tmp/create_tables.sql
      - ./db/pre_seed.sql:/tmp/pre_seed.sql
      - data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASS

volumes:
  data:
